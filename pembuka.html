<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Depan</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f8;
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    color:white;
}

.hero-content{
    background:rgba(0,0,0,0.2);
    padding:30px;
    border-radius:12px;
}

h1{
    margin-bottom:10px;
    font-size:36px;
}

p{
    margin-bottom:20px;
    font-size:18px;
}

.btn{
    text-decoration:none;
    padding:12px 24px;
    background:white;
    color:#333;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#ddd;
}
</style>
</head>

<body>

<section class="hero">
    <div class="hero-content">
        <h1>Selamat Datang</h1>
        <p>Ini adalah halaman pembuka website saya</p>
        <a href="asset/index.html" class="btn">Mulai</a>
    </div>
</section>

</body>
</html>
